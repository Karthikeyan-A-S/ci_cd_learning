<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CI/CD Deployment</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        h1 { color: #333; }
        p { color: #666; font-size: 18px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello from Production! 🚀</h1>
        <p>This website was automatically deployed by GitHub Actions.</p>
        <p style="color: #28a745; font-weight: bold;">✅ Live in the Production Environment</p>
    </div>
</body>
</html>
