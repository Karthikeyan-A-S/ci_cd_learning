name: Linting Workflow

on:
  workflow_dispatch:

jobs:
  lint_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Run the Linter
        # This will scan all Python files in the directory
        run: flake8 .
