name: Artifacts Workflow

on:
  workflow_dispatch:

jobs:
  job1_create_data:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests and generate a report
        run: |
          echo "Test Results: 10 Passed, 0 Failed" > test-report.txt
          echo "Code Coverage: 95%" >> test-report.txt
          echo "Created the test-report.txt file!"

      # Because each job runs on a fresh virtual machine, test-report.txt will be DELETED
      # as soon as this job finishes. To save it, we must upload it as an artifact!
      - name: Upload Test Report as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-test-report # The name of the artifact (you can name it anything)
          path: test-report.txt # The actual file or folder we want to upload

  job2_use_data:
    needs: job1_create_data # This job must wait for job1 to finish uploading the artifact
    runs-on: ubuntu-latest
    steps:
      # We use download-artifact to pull the saved file into this new virtual machine
      - name: Download the Test Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-test-report

      - name: Read the downloaded file
        run: |
          echo "Reading the file generated by job1:"
          cat test-report.txt
