name: Echo Only Workflow

# Trigger this workflow on pushes OR manually via workflow_dispatch
on:
  push:
    branches: [ "feature/echo-and-bug" ]
  workflow_dispatch:
    inputs:
      custom_message:
        description: 'Type a message to echo:'
        required: true
        default: 'This was triggered manually!'
        type: string

jobs:
  echo_job:
    runs-on: ubuntu-latest

    steps:
    - name: Run a simple echo command
      # This will print the custom message if triggered manually, otherwise it falls back to a default string.
      run: echo "${{ inputs.custom_message || 'This ran automatically via push!' }}"

    - name: Run a multi-line echo
      run: |
        echo "This workflow is extremely fast."
        echo "Because there is no code to download and no tests to run."
